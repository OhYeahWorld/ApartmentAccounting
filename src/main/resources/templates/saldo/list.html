<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сальдо</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>
<main class="container">
    <div class="page-head">
        <div><p class="eyebrow">Таблица saldo</p>
            <h1>Сальдо по лицевому счету</h1></div>
    </div>
    <div th:if="${message}" class="notice success" th:text="${message}"></div>
    <div th:if="${error}" class="notice error" th:text="${error}"></div>

    <section class="panel">
        <h2>Добавить запись</h2>
        <form class="form-grid" method="post" th:action="@{/saldo/create}">
            <label>Квартира<input required type="number" min="1" name="apartmentNumber"></label>
            <label>Период<input required type="date" name="period" value="2017-01-01"></label>
            <label>Входящее сальдо<input required type="number" step="0.01" name="openingBalance" value="0"></label>
            <label>Исходящее сальдо<input required type="number" step="0.01" name="closingBalance" value="0"></label>
            <button class="button" type="submit">Добавить</button>
        </form>
    </section>

    <section class="panel">
        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Квартира</th>
                    <th>Период</th>
                    <th>Входящее</th>
                    <th>Исходящее</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${items}">
                    <td th:text="${item.id}">1</td>
                    <td th:text="${item.apartmentNumber}">1</td>
                    <td th:text="${item.period}">2017-01-01</td>
                    <td th:text="${#numbers.formatDecimal(item.openingBalance,1,2)}">0.00</td>
                    <td th:text="${#numbers.formatDecimal(item.closingBalance,1,2)}">0.00</td>
                    <td class="actions">
                        <details>
                            <summary class="button small">Изменить</summary>
                            <form class="mini-form" method="post" th:action="@{/saldo/update}">
                                <input type="hidden" name="id" th:value="${item.id}">
                                <label>Квартира<input required type="number" min="1" name="apartmentNumber"
                                                      th:value="${item.apartmentNumber}"></label>
                                <label>Период<input required type="date" name="period"
                                                    th:value="${item.period}"></label>
                                <label>Входящее<input required type="number" step="0.01" name="openingBalance"
                                                      th:value="${item.openingBalance}"></label>
                                <label>Исходящее<input required type="number" step="0.01" name="closingBalance"
                                                       th:value="${item.closingBalance}"></label>
                                <button class="button small" type="submit">Сохранить</button>
                            </form>
                        </details>
                        <form method="post" th:action="@{/saldo/delete}" onsubmit="return confirm('Удалить запись?');">
                            <input type="hidden" name="id" th:value="${item.id}">
                            <button class="button small danger" type="submit">Удалить</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${items.isEmpty()}">
                    <td colspan="6" class="empty">Записей пока нет.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
