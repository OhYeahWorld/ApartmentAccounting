spring.application.name=rea.ohyeahworld.newpgapp

# По умолчанию используется локальный PostgreSQL.
# Если у тебя другой пароль/порт/хост, меняются только эти 3 значения.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rea.ohyeahworld.newpgapp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.thymeleaf.cache=false
server.port=${PORT:8080}

# Схема создается приложением.
spring.sql.init.mode=never
app.demo-data.enabled=${DEMO_DATA:true}
